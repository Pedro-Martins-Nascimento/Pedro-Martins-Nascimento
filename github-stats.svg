<svg viewBox="0 0 860 160" width="860" height="160"
     xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>
  <style>
    .bg { fill: url(#cardGrad); stroke: #30363d; stroke-width: 1.2; }
    .num { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .lbl { fill: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .divider { stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 4; }
    .section-title { fill: #c9d1d9; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
    .lang-name { fill: #e6edf3; font-size: 12px; font-weight: 600; }
    .lang-pct { fill: #8b949e; font-size: 11px; font-weight: 600; }
    .bar {
      transform-origin: left;
      transform: scaleX(0);
      animation: grow 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect class="bg" x="1" y="1" width="858" height="158" rx="14" ry="14"/>
  
  <text x="35" y="28" class="section-title">📊 GitHub Overview</text>
  <text x="455" y="28" class="section-title">💻 Top Linguagens</text>
  
  <line class="divider" x1="420" y1="20" x2="420" y2="140"/>
  
  
    <g transform="translate(75, 0)">
      <text x="0" y="74" text-anchor="middle" class="num" fill="#38bdf8">235</text>
      <text x="0" y="98" text-anchor="middle" class="lbl">Contribuições</text>
    </g>
    <g transform="translate(210, 0)">
      <text x="0" y="74" text-anchor="middle" class="num" fill="#22c55e">54 dias</text>
      <text x="0" y="98" text-anchor="middle" class="lbl">Streak Atual 🔥</text>
    </g>
    <g transform="translate(345, 0)">
      <text x="0" y="74" text-anchor="middle" class="num" fill="#a855f7">54 dias</text>
      <text x="0" y="98" text-anchor="middle" class="lbl">Maior Streak</text>
    </g>
  
    <circle cx="455" cy="39" r="4" fill="#f1e05a" />
    <text x="467" y="43" class="lang-name">JavaScript</text>
    <text x="825" y="43" text-anchor="end" class="lang-pct">44.4%</text>
    <rect x="455" y="48" width="370" height="5" rx="2.5" fill="#21262d"/>
    <rect x="455" y="48" width="164.3" height="5" rx="2.5" fill="#f1e05a" class="bar" style="animation-delay:0.00s"/>
    <circle cx="455" cy="61" r="4" fill="#00B4AB" />
    <text x="467" y="65" class="lang-name">Dart</text>
    <text x="825" y="65" text-anchor="end" class="lang-pct">11.1%</text>
    <rect x="455" y="70" width="370" height="5" rx="2.5" fill="#21262d"/>
    <rect x="455" y="70" width="41.1" height="5" rx="2.5" fill="#00B4AB" class="bar" style="animation-delay:0.08s"/>
    <circle cx="455" cy="83" r="4" fill="#178600" />
    <text x="467" y="87" class="lang-name">C#</text>
    <text x="825" y="87" text-anchor="end" class="lang-pct">11.1%</text>
    <rect x="455" y="92" width="370" height="5" rx="2.5" fill="#21262d"/>
    <rect x="455" y="92" width="41.1" height="5" rx="2.5" fill="#178600" class="bar" style="animation-delay:0.16s"/>
    <circle cx="455" cy="105" r="4" fill="#336790" />
    <text x="467" y="109" class="lang-name">PLpgSQL</text>
    <text x="825" y="109" text-anchor="end" class="lang-pct">11.1%</text>
    <rect x="455" y="114" width="370" height="5" rx="2.5" fill="#21262d"/>
    <rect x="455" y="114" width="41.1" height="5" rx="2.5" fill="#336790" class="bar" style="animation-delay:0.24s"/>
    <circle cx="455" cy="127" r="4" fill="#41b883" />
    <text x="467" y="131" class="lang-name">Vue</text>
    <text x="825" y="131" text-anchor="end" class="lang-pct">11.1%</text>
    <rect x="455" y="136" width="370" height="5" rx="2.5" fill="#21262d"/>
    <rect x="455" y="136" width="41.1" height="5" rx="2.5" fill="#41b883" class="bar" style="animation-delay:0.32s"/>
</svg>